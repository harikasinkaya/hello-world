<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poweroff.cc - Welcome to the Network</title>
    <style>
        /* Temel Ayarlar ve Kusursuz Ortalama */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Sabit Dijital Ağ Arka Planı */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-image: 
                radial-gradient(circle, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                radial-gradient(circle, rgba(97, 211, 249, 0.03) 1px, transparent 1.5px);
            background-size: 80px 80px, 120px 120px;
            background-position: 0 0, 40px 40px;
            opacity: 0.8;
            pointer-events: none;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 30%, #000000 95%);
            z-index: 2;
            pointer-events: none;
        }

        /* İçerik Bloğu */
        .content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 90%;
            max-width: 850px; /* Büyüyen içerik için genişletildi */
            animation: fadeIn 1.5s ease-out;
            transform: translateY(-25%); 
            gap: 5px; 
        }

        /* Logo Ayarları */
        .logo {
            max-width: 550px; /* Logo belirgin şekilde büyütüldü */
            width: 100%;
            height: auto;
            /* Logo büyüdüğü için boşluk da büyüdü, eksi değeri artırdık */
            margin-bottom: -100px; 
            filter: drop-shadow(0 0 20px rgba(97, 211, 249, 0.25));
            position: relative;
            z-index: 3;
        }

        /* Metin Ayarları */
        h1 {
            font-size: 1.8rem; /* Yazı boyutu artırıldı */
            margin: -15px 0 0 0; 
            font-weight: normal;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
            line-height: 1.2;
            position: relative;
            z-index: 4; 
        }

        p {
            font-size: 1.3rem; /* Alt yazı boyutu artırıldı */
            margin: 5px 0 15px 0; 
            color: #61d3f9; 
            text-shadow: 0 0 10px rgba(97, 211, 249, 0.45);
            letter-spacing: 0.5px;
            position: relative;
            z-index: 4;
        }

        /* Buton Tasarımı */
        .btn {
            display: inline-block;
            padding: 16px 45px;
            font-size: 1.15rem; /* Buton yazısı da genel orantıya uyacak şekilde çok hafif büyütüldü */
            color: #000000;
            background-color: #61d3f9;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 0 20px rgba(97, 211, 249, 0.6);
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            letter-spacing: 1.5px;
            border: none;
            cursor: pointer;
            margin-top: 10px; 
            position: relative;
            z-index: 4;
        }

        .btn:hover {
            background-color: #ffffff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
        }

        /* Animasyon */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15%); }
            to { opacity: 1; transform: translateY(-25%); } 
        }

        @media (max-width: 600px) {
            .logo { 
                max-width: 380px; 
                margin-bottom: -65px; 
            }
            h1 { font-size: 1.4rem; margin-top: -10px; }
            p { font-size: 1.1rem; }
            .btn { padding: 14px 35px; font-size: 1rem; }
            .content { transform: translateY(-28%); }
        }
    </style>
</head>
<body>

    <div class="background"></div>
    <div class="overlay"></div>

    <div class="content">
        <img src="logo.png" alt="Poweroff Logo" class="logo">
        <h1>Welcome to the darkness of the Network.</h1>
        <p>Power off any system..</p>
        <a href="https://discord.gg/poweroff" class="btn">JOIN TO UNDERGROUND</a>
    </div>

</body>
</html>
