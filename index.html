<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poweroff.cc - Welcome to the Network</title>
    <style>
        /* Temel Ayarlar */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Sabit Dijital Ağ Arka Planı (Görseldeki gibi hafif noktalar ve bağlar) */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-image: 
                radial-gradient(circle, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                radial-gradient(circle, rgba(97, 211, 249, 0.03) 1px, transparent 1.5px);
            background-size: 80px 80px, 120px 120px;
            background-position: 0 0, 40px 40px;
            opacity: 0.8;
        }

        /* Ekstra derinlik için hafif gölgelendirme katmanı */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 30%, #000000 95%);
            z-index: 2;
        }

        /* Tam Ortalanmış İçerik Bloğu */
        .content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #ffffff;
            width: 90%;
            max-width: 650px;
            /* Dikeyde ve yatayda tam sığması için kompakt padding ve margin */
            padding: 20px;
            animation: fadeIn 1.5s ease-out;
        }

        /* Logo Ayarları - Şeffaf Logo */
        .logo {
            max-width: 280px;
            width: 100%;
            height: auto;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 20px rgba(97, 211, 249, 0.25));
        }

        /* Metin Ayarları */
        h1 {
            font-size: 1.45rem;
            margin: 0 0 8px 0;
            font-weight: normal;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
            line-height: 1.4;
        }

        p {
            font-size: 1.1rem;
            margin: 0 0 35px 0;
            color: #61d3f9; /* Logodaki mavi/turkuaz tonu */
            text-shadow: 0 0 10px rgba(97, 211, 249, 0.45);
            letter-spacing: 0.5px;
        }

        /* Buton Tasarımı */
        .btn {
            display: inline-block;
            padding: 15px 40px;
            font-size: 1.1rem;
            color: #000000;
            background-color: #61d3f9;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 0 20px rgba(97, 211, 249, 0.6);
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            letter-spacing: 1.5px;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #ffffff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.9);
            transform: translateY(-2px); /* Çok hafif yukarı tepki */
        }

        /* Giriş Animasyonu */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobil Cihazlar İçin Optimizasyon */
        @media (max-width: 600px) {
            .logo { max-width: 220px; }
            h1 { font-size: 1.1rem; }
            p { font-size: 0.95rem; }
            .btn { padding: 12px 30px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <!-- Sabit Dijital Ağ / Nokta Efekti Arka Planı -->
    <div class="background"></div>
    <div class="overlay"></div>

    <!-- Merkez İçerik (Dikey ve Yatayda Kusursuz Hizalanmış) -->
    <div class="content">
        <!-- Logo görselinin adını kendi dosya adınla (örn. logo.png) değiştirmeyi unutma -->
        <img src="logo.png" alt="Poweroff Logo" class="logo">
        <h1>Welcome to the darkness of the Network.</h1>
        <p>Power off any system..</p>
        <a href="https://discord.gg/poweroff" class="btn">JOIN TO UNDERGROUND</a>
    </div>

</body>
</html>
